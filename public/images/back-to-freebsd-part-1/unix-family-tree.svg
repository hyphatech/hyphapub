<svg viewBox="0 0 680 524" width="680" height="524" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The Unix family tree, 1970 to 2007</title>
  <desc id="d">Unix at Bell Labs, from 1971 to 1989, by Ken Thompson and Dennis Ritchie, gives rise to two families. BSD, from 1978 to 1995, by Bill Joy, leads to SunOS and from it Solaris, to NeXTSTEP and through it Mac OS X, and in 1993 to NetBSD and FreeBSD. OpenBSD forks from NetBSD and is first released in 1996. Xenix, Microsoft and SCO, from 1980 to 1991, comes from Bell Labs Unix, as do the System V systems HP-UX, AIX, IRIX, which ends in 2006, and UnixWare. Minix, by Andrew S. Tanenbaum, from 1987, is a clone of Unix rather than a descendant, and the GNU Project, by Richard Stallman, from 1983, stands outside both families. Linux, by Linus Torvalds, from 1991, joins GNU and owes Minix its start.</desc>
  <!-- Dates are first and last releases to the month, from each system's article on Wikipedia. Text that stands on the paper carries a halo of paper, so a decade's hairline stops at its words. -->
  <style>
    /* Inter Tight 400, its Latin letters only, carried inside the drawing:
       an image cannot load the page's fonts. */
    @font-face { font-family: 'Inter Tight'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
    text { font-family: 'Inter Tight', 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif; }
  </style>
