<svg viewBox="0 0 680 316" width="680" height="316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The FreeBSD stack</title>
  <desc id="d">The FreeBSD stack, from the bottom up: the BSD kernel, then the filesystem and userspace, then jails, native OS-level containers since 2000, then optional jail managers such as cbsd, bastille, pot and appjail, and your application on top.</desc>
  <style>
    /* Inter Tight 400, its Latin letters only, carried inside the drawing:
       an image cannot load the page's fonts. */
    @font-face { font-family: 'Inter Tight'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
    text { font-family: 'Inter Tight', 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif; }
  </style>
  <rect width="680" height="316" fill="#f3efe8"/>
  <text x="24" y="36" font-size="10" fill="#655d54" letter-spacing="1.2">FREEBSD</text>
  <!-- Your application: y=48..92 -->
  <rect x="24" y="48" width="632" height="44" rx="8" fill="#f3efe8" stroke="#15120e"/>
  <text x="44" y="75" font-size="13" fill="#15120e">Your application</text>
  <!-- Jail managers, optional: y=98..142 -->
  <rect x="24" y="98" width="632" height="44" rx="8" fill="#f3efe8" stroke="#655d54" stroke-dasharray="5,4"/>
  <text x="44" y="125" font-size="13" fill="#15120e">Jail managers, optional</text>
  <text x="636" y="125" font-size="11" fill="#655d54" text-anchor="end">cbsd, bastille, pot, appjail and others</text>
  <!-- Jails (2000): y=148..192 -->
  <rect x="24" y="148" width="632" height="44" rx="8" fill="#f3efe8" stroke="#9a7410" stroke-width="1.25"/>
  <text x="44" y="175" font-size="13" fill="#15120e">Jails (2000)</text>
  <text x="636" y="175" font-size="11" fill="#655d54" text-anchor="end">native OS-level containers</text>
  <!-- Filesystem + userspace: y=198..242 -->
  <rect x="24" y="198" width="632" height="44" rx="8" fill="#ebe6dd" stroke="#d6cfc2"/>
  <text x="44" y="225" font-size="13" fill="#15120e">Filesystem + userspace</text>
  <!-- BSD kernel: y=248..292 -->
  <rect x="24" y="248" width="632" height="44" rx="8" fill="#15120e"/>
  <text x="44" y="275" font-size="13" fill="#f3efe8">BSD kernel</text>
</svg>
